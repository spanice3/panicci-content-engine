<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[{"id":"cta","type":"string","label":"End-card button","default":"Grade my site free — 60 seconds"},{"id":"url","type":"string","label":"End-card URL","default":"panicciventures.com"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #f8f4ec;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- Panicci Ventures promo, 9:16. Every scene is real: site copy, client map-pack screenshots, homepage capture. -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="22"
      data-width="1080"
      data-height="1920"
    >
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="3.6" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="abc" data-composition-id="abc" data-composition-src="compositions/abc.html"
        data-start="3.6" data-duration="4.6" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="desertdog" data-composition-id="desertdog" data-composition-src="compositions/desertdog.html"
        data-start="8.2" data-duration="4.3" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="gjjw" data-composition-id="gjjw" data-composition-src="compositions/gjjw.html"
        data-start="12.5" data-duration="4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="site" data-composition-id="site" data-composition-src="compositions/site.html"
        data-start="16.5" data-duration="2.6" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
        data-start="19.1" data-duration="2.9" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
