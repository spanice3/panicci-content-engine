<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[{"id":"cta","type":"string","label":"End-card button","default":"Grade my site free — 60 seconds"},{"id":"url","type":"string","label":"End-card URL","default":"panicciventures.com"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #fbfaf6;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- GJJW case-study clip, 9:16. Grid numbers are Search Atlas local heatmaps (business 126116), pulled 2026-10-22. -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="23.4"
      data-width="1080"
      data-height="1920"
    >
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="3.2" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="grid" data-composition-id="grid" data-composition-src="compositions/grid.html"
        data-start="3.2" data-duration="5.2" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="shot" data-composition-id="shot" data-composition-src="compositions/shot.html"
        data-start="8.4" data-duration="3.6" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="compete" data-composition-id="compete" data-composition-src="compositions/compete.html"
        data-start="12" data-duration="4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="streak" data-composition-id="streak" data-composition-src="compositions/streak.html"
        data-start="16" data-duration="4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
        data-start="20" data-duration="3.4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
