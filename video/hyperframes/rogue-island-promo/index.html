<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[{"id":"cta","type":"string","label":"End-card button","default":"Grade my site free — 60 seconds"},{"id":"url","type":"string","label":"End-card URL","default":"panicciventures.com"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #1a4224;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- Rogue Island case-study clip, 9:16. Numbers are Google Search Console (US), pulled 2026-10-22 via Search Atlas. -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="21"
      data-width="1080"
      data-height="1920"
    >
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="3.4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="site" data-composition-id="site" data-composition-src="compositions/site.html"
        data-start="3.4" data-duration="4" data-track-index="1" data-track-kind="graphics"

      <div id="reach" data-composition-id="reach" data-composition-src="compositions/reach.html"

        data-width="1080" data-height="1920"></div>
      <div id="keywords" data-composition-id="keywords" data-composition-src="compositions/keywords.html"
        data-start="12.6" data-duration="4.8" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
        data-start="17.4" data-duration="3.6" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
